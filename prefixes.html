<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Префиксы — NOVACRAFT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M16 4 4 11v10l12 7 12-7V11z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-hero anim-fade-up">
      <h1 class="text-glow">Префиксы</h1>
      <p>Красочный ник на сервере и в чате.</p>
    </div>

    <!-- Префиксы. Данные из Supabase (таблица prefixes + profiles.prefixes) -->
    <div class="pfx-wrap anim-fade-up delay-1">
      <div class="seg pfx-tabs">
        <button class="os-tab active" data-tab="open" type="button">Доступные</button>
        <button class="os-tab" data-tab="closed" type="button">Закрытые</button>
      </div>

      <div id="pfx-open"></div>
      <div id="pfx-closed" style="display:none"></div>

      <div class="pfx-note">
        <strong>Как это работает.</strong> «Доступные» — префиксы, которые тебе выдала администрация:
        выбираешь любой и нажимаешь «Надеть». «Закрытые» — префиксы, которых у тебя пока нет,
        но они существуют. Один надетый префикс за раз, менять можно в любой момент.
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const openHost = document.getElementById('pfx-open');
      const closedHost = document.getElementById('pfx-closed');

      let prefixes = [];
      if (window.DB && DB.configured && DB.listPrefixes) {
        try { prefixes = await DB.listPrefixes() || []; } catch (e) { prefixes = []; }
      }

      const user = (window.Auth && Auth.getCurrentUser) ? Auth.getCurrentUser() : null;
      const mine = new Set(Array.isArray(user && user.prefixes) ? user.prefixes : []);
      const worn = (user && user.activePrefix) || '';

      function pfxCard(p, extra) {
        return `
          <div class="pfx-card glass">
            <span class="pfx-name"${p.color ? ` style="color:${MC.esc(p.color)};text-shadow:0 0 12px ${MC.esc(p.color)}"` : ''}>${MC.esc(p.name)}</span>
            <span class="pfx-priority">${Number(p.priority) > 0 ? 'приоритет ' + p.priority : 'без приоритета'}</span>
            ${extra || ''}
          </div>
        `;
      }

      function wearBtn(p) {
        if (worn === p.name) {
          return `<span class="pfx-worn-mark">&#10003; Надето</span>`;
        }
        return `<button class="btn btn-sm pfx-wear" data-name="${MC.esc(p.name)}" type="button">Надеть</button>`;
      }

      function render() {
        const mineList = prefixes.filter(p => mine.has(p.name));
        const closedList = prefixes.filter(p => !mine.has(p.name));

        if (mineList.length) {
          openHost.innerHTML = `<div class="pfx-grid">` + mineList.map(p => pfxCard(p, wearBtn(p))).join('') + `</div>`;
        } else {
          openHost.innerHTML = `<div class="pfx-empty"><b>${user ? 'Тебе пока не выдали префиксы' : 'Войди, чтобы увидеть свои префиксы'}</b></div>`;
        }

        if (closedList.length) {
          closedHost.innerHTML = `<div class="pfx-grid">` + closedList.map(p => pfxCard(p)).join('') + `</div>`;
        } else {
          closedHost.innerHTML = `<div class="pfx-empty"><b>У тебя все префиксы проекта</b></div>`;
        }

        openHost.querySelectorAll('.pfx-wear').forEach(btn => {
          btn.addEventListener('click', () => {
            if (!user) return;
            Auth.updateCurrentUser(u => { u.activePrefix = btn.dataset.name; });
            if (window.DB && DB.refreshPrefixColors) DB.refreshPrefixColors().catch(() => {});
            if (window.buildHeader) buildHeader();
            render();
          });
        });
      }

      render();

      $$('.pfx-tabs .os-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.pfx-tabs .os-tab').forEach(b => b.classList.toggle('active', b === btn));
          const open = btn.dataset.tab === 'open';
          openHost.style.display = open ? '' : 'none';
          closedHost.style.display = open ? 'none' : '';
        });
      });
    });
  </script>
</body>
</html>

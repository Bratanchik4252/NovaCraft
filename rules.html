<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Правила — NOVACRAFT</title>
  <link rel="icon" href="img/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-hero anim-fade-up">
      <h1 class="text-glow">Правила</h1>
      <p>Нарушение правил карается баном. Оспорить наказание можно в разделе «Обращения».</p>
    </div>

    <!-- TODO: правила придут с бэкенда /api/rules, редактирование — в админ-панели -->
    <div class="cabinet anim-fade-up delay-1">
      <aside class="glass cab-side">
        <button class="cab-tab active" data-tab="rules-project" type="button">Правила проекта</button>
        <button class="cab-tab" data-tab="rules-servers" type="button">Правила серверов</button>
      </aside>

      <section>
        <!-- ============ ПРАВИЛА ПРОЕКТА ============ -->
        <div class="cab-panel active" id="panel-rules-project">
          <h3>Правила проекта</h3>
          <p class="text-muted">Действуют на всех серверах проекта NOVACRAFT.</p>
          <div class="acc-host">
          <div class="acc-item open">
            <button class="acc-head" type="button">
              <span class="acc-num">1</span>
              <span>Общие правила</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>

          <div class="acc-item">
            <button class="acc-head" type="button">
              <span class="acc-num">2</span>
              <span>Аккаунт</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>

          <div class="acc-item">
            <button class="acc-head" type="button">
              <span class="acc-num">3</span>
              <span>Чат и общение</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>

          <div class="acc-item">
            <button class="acc-head" type="button">
              <span class="acc-num">4</span>
              <span>Строительство и гриферство</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>

          <div class="acc-item">
            <button class="acc-head" type="button">
              <span class="acc-num">5</span>
              <span>Экономика и магазин</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>
          </div>
        </div>

        <!-- ============ ПРАВИЛА СЕРВЕРОВ ============ -->
        <div class="cab-panel" id="panel-rules-servers">
          <h3>Правила серверов</h3>
          <p class="text-muted">Дополняют общие правила проекта на отдельных серверах.</p>
          <div class="acc-host">
          <div class="acc-item open">
            <button class="acc-head" type="button">
              <span class="acc-num">1</span>
              <span>Общие правила серверов</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>

          <div class="acc-item">
            <button class="acc-head" type="button">
              <span class="acc-num">2</span>
              <span>Анархия</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>

          <div class="acc-item">
            <button class="acc-head" type="button">
              <span class="acc-num">3</span>
              <span>Мирный (выживание)</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>

          <div class="acc-item">
            <button class="acc-head" type="button">
              <span class="acc-num">4</span>
              <span>Креатив</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>

          <div class="acc-item">
            <button class="acc-head" type="button">
              <span class="acc-num">5</span>
              <span>Ивенты</span>
              <svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="acc-body">
              <div class="acc-body-inner">
              </div>
            </div>
          </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      var tabs = document.querySelectorAll('.cab-tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.toggle('active', t === tab); });
          document.querySelectorAll('.cab-panel').forEach(function (p) {
            p.classList.toggle('active', p.id === 'panel-' + tab.dataset.tab);
          });
        });
      });

      // ---------- Правила из Supabase (таблица rules), фолбэк — статический HTML ----------
      var DEFAULT_RULES = {
        project: [
          { title: 'Общие правила', text: '' },
          { title: 'Аккаунт', text: '' },
          { title: 'Чат и общение', text: '' },
          { title: 'Строительство и гриферство', text: '' },
          { title: 'Экономика и магазин', text: '' },
        ],
        servers: [
          { title: 'Общие правила серверов', text: '' },
          { title: 'Анархия', text: '' },
          { title: 'Мирный (выживание)', text: '' },
          { title: 'Креатив', text: '' },
          { title: 'Ивенты', text: '' },
        ],
      };

      function escText(s) {
        var div = document.createElement('div');
        div.textContent = String(s == null ? '' : s);
        return div.innerHTML;
      }

      function renderSection(panelId, items) {
        var panel = document.getElementById(panelId);
        if (!panel) return;
        var html = (items.length ? items : DEFAULT_RULES[panelId === 'panel-rules-project' ? 'project' : 'servers'])
          .map(function (r, i) {
            var lines = String(r.text || '').split('\n').map(escText).join('<br>');
            return '<div class="acc-item' + (i === 0 ? ' open' : '') + '">' +
              '<button class="acc-head" type="button">' +
              '<span class="acc-num">' + (i + 1) + '</span>' +
              '<span>' + escText(r.title) + '</span>' +
              '<svg class="acc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
              '</button>' +
              '<div class="acc-body"><div class="acc-body-inner">' + lines + '</div></div>' +
              '</div>';
          }).join('');
        var host = panel.querySelector('.acc-host');
        if (host) host.innerHTML = html;
        panel.querySelectorAll('.acc-head').forEach(function (head) {
          head.addEventListener('click', function () {
            head.parentElement.classList.toggle('open');
          });
        });
      }

      if (window.DB && DB.configured && DB.listRules) {
        DB.listRules().then(function (rows) {
          if (!rows || !rows.length) return;
          var bySection = { project: [], servers: [] };
          rows.forEach(function (r) {
            var s = r.section === 'servers' ? 'servers' : 'project';
            bySection[s].push(r);
          });
          renderSection('panel-rules-project', bySection.project);
          renderSection('panel-rules-servers', bySection.servers);
        }).catch(function () {});
      }

      document.querySelectorAll('.acc-head').forEach(function (head) {
        head.addEventListener('click', function () {
          head.parentElement.classList.toggle('open');
        });
      });
    })();
  </script>
</body>
</html>

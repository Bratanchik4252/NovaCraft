<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск игроков — NOVACRAFT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M16 4 4 11v10l12 7 12-7V11z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-hero anim-fade-up">
      <h1 class="text-glow">Поиск игроков</h1>
      <p>Найди игрока и открой его профиль.</p>
    </div>

    <div class="glass card anim-fade-up delay-1" style="max-width:720px;margin:0 auto">
      <!-- TODO: заменить на API /api/players?query= -->
      <div class="field">
        <input type="text" id="player-search" placeholder="Введите никнейм..." autocomplete="off">
      </div>
      <div id="search-spinner" style="display:none"><div class="spinner"></div></div>
      <div id="search-results" style="display:flex;flex-direction:column;gap:12px"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script src="js/players-data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('player-search');
      const spinnerWrap = document.getElementById('search-spinner');
      const results = document.getElementById('search-results');
      if (!input || !results) return;

      let timer = null;
      input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (!q) {
          spinnerWrap.style.display = 'none';
          results.innerHTML = '';
          return;
        }
        spinnerWrap.style.display = 'block';
        results.innerHTML = '';

        // Имитация сетевой задержки 0.5–1 сек. TODO: реальный запрос
        const delay = 400 + Math.random() * 400;
        timer = setTimeout(() => {
          spinnerWrap.style.display = 'none';
          const found = window.searchPlayers(q);
          if (!found.length) {
            results.innerHTML = '<div class="text-muted text-center" style="padding:20px">Никто не найден</div>';
            return;
          }
          results.innerHTML = found
            .map(p => `
              <button class="glass card player-row" data-name="${MC.esc(p.name)}"
                style="display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;border-radius:14px">
                ${p.avatar
                  ? `<img class="avatar" src="${MC.esc(p.avatar)}" alt="">`
                  : `<span class="avatar" style="display:flex;align-items:center;justify-content:center;font-weight:800">${MC.esc(p.name[0])}</span>`}
                <div style="flex:1">
                  <div style="font-weight:700">${MC.esc(p.name)}</div>
                  <div class="text-muted" style="font-size:14px">${Number(p.blocks).toLocaleString('ru-RU')} блоков</div>
                </div>
                <div style="text-align:right">
                  <span class="badge ${p.online ? 'online' : 'offline'}"><span class="dot"></span>${p.online ? 'онлайн' : 'офлайн'}</span>
                  <div style="margin-top:6px;font-size:14px" class="text-muted">${Number(p.coins).toLocaleString('ru-RU')} монет</div>
                </div>
              </button>
            `)
            .join('');

          results.querySelectorAll('.player-row').forEach(row => {
            row.addEventListener('click', () => {
              location.href = 'player.html?name=' + encodeURIComponent(row.dataset.name);
            });
          });
        }, delay);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Банлист — NOVACRAFT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M16 4 4 11v10l12 7 12-7V11z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-hero anim-fade-up">
      <h1 class="text-glow">Банлист</h1>
    </div>

    <!-- Банлист. Данные из Supabase (таблица bans), пока пусто — заглушка -->
    <div id="bans-list"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const host = document.getElementById('bans-list');

      let bans = [];
      if (window.DB && DB.configured && DB.listBans) {
        try { bans = await DB.listBans() || []; } catch (e) { bans = []; }
      }

      if (!Array.isArray(bans) || !bans.length) {
        host.innerHTML = '<div class="glass empty-state anim-fade-up"><p class="text-muted">Никто ещё не был забанен на сервере</p></div>';
        return;
      }

      host.innerHTML = `
        <div class="glass anim-fade-up">
          <table class="bans-table">
            <thead>
              <tr>
                <th>Игрок</th>
                <th>Причина</th>
                <th>Администратор</th>
                <th>Дата</th>
                <th>До</th>
              </tr>
            </thead>
            <tbody>
              ${bans.filter(b => b.active).map(b => {
                const until = b.expires_at ? new Date(b.expires_at).toLocaleDateString('ru-RU') : 'Навсегда';
                const date = b.banned_at ? new Date(b.banned_at).toLocaleDateString('ru-RU') : '—';
                return `
                  <tr>
                    <td class="bans-nick">${MC.esc(b.nick)}</td>
                    <td>${MC.esc(b.reason || '—')}</td>
                    <td>${MC.esc(b.banned_by || '—')}</td>
                    <td>${MC.esc(date)}</td>
                    <td>${MC.esc(until)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    });
  </script>
</body>
</html>

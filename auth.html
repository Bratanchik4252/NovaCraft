<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход / Регистрация — NOVACRAFT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M16 4 4 11v10l12 7 12-7V11z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="page-content">
    <div class="page-hero anim-fade-up">
      <h1 class="text-glow">Вход в аккаунт</h1>
      <p>Зарегистрируйся — и получи доступ к лаунчеру, статистике и серверам.</p>
    </div>

    <!-- Предупреждение о блокировке (защита от брутфорса) -->
    <div class="glass card" id="lock-box" style="display:none;max-width:480px;margin:0 auto 20px;border-color:var(--danger);text-align:center">
      <strong style="color:var(--danger)">Слишком много попыток входа.</strong>
      <div style="margin-top:6px">Аккаунт заблокирован. Подождите: <span id="lock-timer" style="font-weight:800"></span></div>
    </div>

    <div class="glass form-box anim-fade-up delay-1">
      <!-- Переключатель Вход / Регистрация -->
      <div class="auth-tabs">
        <button type="button" id="tab-login" class="active">Вход</button>
        <button type="button" id="tab-register">Регистрация</button>
      </div>

      <!-- ======== ФОРМА ВХОДА ======== -->
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-identifier">Email или никнейм</label>
          <input type="text" id="login-identifier" placeholder="you@mail.com" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
          <span class="error-msg" id="login-error"></span>
          <span class="text-muted" id="attempts-info" style="font-size:13px;min-height:18px"></span>
        </div>

        <!-- CSRF-токен для форм (заглушка) -->
        <input type="hidden" id="csrf" value="csrf_static">

        <button type="submit" class="btn btn-primary" style="width:100%">Войти</button>

        <p class="text-center text-muted" style="font-size:14px;margin-top:14px">
          Нет аккаунта? <a href="#" onclick="document.getElementById('tab-register').click();return false" style="text-decoration:underline">Зарегистрироваться</a>
        </p>
      </form>

      <!-- ======== ФОРМА РЕГИСТРАЦИИ ======== -->
      <!-- Поток: email → проверка что email свободен → ник + пароль.
           Без отправки писем: email просто проверяется, что не занят. -->
      <form id="register-form" novalidate style="display:none">
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@mail.com" autocomplete="email" required>
          <span class="error-msg" id="reg-email-error"></span>
          <button type="button" class="btn" id="reg-email-send" style="width:100%;margin-top:10px">Подтвердить почту</button>
        </div>

        <div id="reg-main-step" style="display:none">
          <div class="field">
            <label for="reg-name">Никнейм</label>
            <input type="text" id="reg-name" placeholder="Steve_Master" maxlength="16" autocomplete="username" required>
            <span class="error-msg" id="reg-name-error"></span>
            <div class="reg-suggestions" id="reg-suggestions"></div>
          </div>
          <div class="field">
            <label for="reg-password">Пароль</label>
            <input type="password" id="reg-password" placeholder="Минимум 8 символов, буквы и цифры" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label for="reg-password2">Подтверждение пароля</label>
            <input type="password" id="reg-password2" placeholder="Повторите пароль" autocomplete="new-password" required>
            <span class="error-msg" id="register-error"></span>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Создать аккаунт</button>
        </div>

        <p class="text-center text-muted" style="font-size:14px;margin-top:14px">
          Уже есть аккаунт? <a href="#" onclick="document.getElementById('tab-login').click();return false" style="text-decoration:underline">Войти</a>
        </p>
      </form>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
